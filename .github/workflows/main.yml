name: Deribit Options Snapshot

on:
  schedule:
    # 07:45 UTC daily (1:15 PM IST) — 15 minutes BEFORE Deribit's 08:00 UTC expiry.
    - cron: '45 7 * * *'
    # 08:05 UTC daily (1:35 PM IST) — 5 minutes AFTER expiry, once the new
    # day's option chain has rolled over. Gives you a fresh "start of day"
    # snapshot for before/after comparison.
    - cron: '5 8 * * *'
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab to test

permissions:
  contents: write   # needed so the workflow can commit the screenshot back to the repo

jobs:
  snapshot:
    # Runs on GitHub's normal free servers — safe now, since this script only
    # calls Deribit's public data API (not geo-blocked) and screenshots our
    # own locally-generated HTML file, never the real deribit.com website.
    runs-on: ubuntu-latest
    env:
      # Labels the output filename so you can tell the two daily runs apart.
      SNAPSHOT_LABEL: ${{ github.event.schedule == '45 7 * * *' && 'pre-expiry' || github.event.schedule == '5 8 * * *' && 'post-expiry' || 'manual' }}
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Install headless browser
        run: npx playwright install chromium --with-deps

      - name: Take snapshot
        run: node snapshot.js

      - name: Commit snapshot to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add snapshots/*.png
          git commit -m "Snapshot $(date -u +'%Y-%m-%d %H:%M UTC')" || echo "Nothing to commit"
          git push
